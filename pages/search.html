<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Archive — OFFSET®</title>
  <meta name="description" content="Search the authored spatial coordinates of Seoul.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ========================================================
       OFFSET® Search Archive — Typographic Minimal Architecture
       ======================================================== */
    :root {
      --color-ink: #111111;
      --color-paper: #F2F0EA;
      --color-graphite: #242424;
      --color-muted: #858585;
      --color-line: rgba(17, 17, 17, 0.12);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      --container-width: 1600px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    body {
      background-color: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::selection {
      background: var(--color-ink);
      color: var(--color-paper);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      color: inherit;
      font-family: inherit;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 0 56px;
    }

    /* Custom Cursor */
    .custom-cursor {
      position: fixed;
      top: -16px;
      left: -16px;
      width: 10px;
      height: 10px;
      background-color: var(--color-ink);
      border-radius: 50% !important;
      pointer-events: none;
      z-index: 9999;
      transform: translate3d(0, 0, 0);
      transition: width 0.2s ease, height 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-cursor__label {
      display: none;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--color-paper);
      letter-spacing: 0.12em;
    }

    .custom-cursor--expanded {
      width: 64px;
      height: 64px;
      top: -32px;
      left: -32px;
      background-color: rgba(17, 17, 17, 0.9);
      backdrop-filter: blur(4px);
    }

    .custom-cursor--expanded .custom-cursor__label {
      display: block;
    }

    /* Minimal Chrome Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 1px solid var(--color-line);
      background-color: rgba(242, 240, 234, 0.9);
      backdrop-filter: blur(10px);
    }

    .header__inner {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr;
      align-items: center;
      height: 56px;
    }

    .header__brand {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    .header__logo {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .header__nav {
      display: flex;
      gap: 40px;
    }

    .header__nav-link {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .header__nav-link--active {
      opacity: 1;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .header__actions {
      display: flex;
      justify-content: flex-end;
      gap: 32px;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Search Area */
    .search-main {
      flex-grow: 1;
      padding: 110px 0 160px;
    }

    .search-input-box {
      margin-bottom: 64px;
      border-bottom: 1px solid var(--color-ink);
      padding-bottom: 24px;
    }

    .editorial-search__input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 6.5vw, 6rem);
      font-weight: 300;
      color: var(--color-ink);
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .editorial-search__input::placeholder {
      color: rgba(17, 17, 17, 0.2);
    }

    .search-meta-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      color: var(--color-muted);
      text-transform: uppercase;
      margin-bottom: 48px;
      border-bottom: 1px solid var(--color-line);
      padding-bottom: 18px;
    }

    /* Results Index List */
    .search-results-list {
      display: flex;
      flex-direction: column;
    }

    .index-row {
      display: grid;
      grid-template-columns: 100px 3fr 1.5fr 1fr 40px;
      align-items: baseline;
      padding: 28px 0;
      border-bottom: 1px solid var(--color-line);
      cursor: pointer;
      transition: padding-left 280ms cubic-bezier(0.2, 0.6, 0.25, 1), opacity 280ms ease;
    }

    .index-row:hover {
      padding-left: 24px;
      border-bottom-color: var(--color-ink);
    }

    .index-row__num {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--color-muted);
    }

    .index-row__name {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3.2vw, 3.2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .index-row__meta,
    .index-row__cat {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .index-row__arrow {
      font-size: 1.2rem;
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .index-row:hover .index-row__arrow {
      opacity: 1;
    }

    /* Empty State */
    .search-empty {
      display: none;
      padding: 100px 0;
      text-align: left;
    }

    .search-empty__title {
      font-family: var(--font-serif);
      font-size: 3rem;
      font-weight: 300;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .search-empty__desc {
      color: var(--color-muted);
      font-size: 1rem;
    }

    /* Floating Cinematic Preview */
    .cinematic-preview {
      position: fixed;
      top: 0;
      left: 0;
      width: 360px;
      height: 480px;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 300ms cubic-bezier(0.2, 0.6, 0.25, 1), visibility 300ms;
      background-color: var(--color-graphite);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cinematic-preview--active {
      opacity: 1;
      visibility: visible;
    }

    .cinematic-preview__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Footer */
    .footer {
      padding: 96px 0 48px;
      border-top: 1px solid var(--color-line);
      background-color: var(--color-paper);
      margin-top: auto;
    }

    .footer__bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--color-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (max-width: 1024px) {
      .container {
        padding: 0 32px;
      }
      .custom-cursor {
        display: none !important;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 20px;
      }
      .header__inner {
        grid-template-columns: 1fr 1fr;
      }
      .header__nav {
        display: none;
      }
      .index-row {
        grid-template-columns: 48px 1fr 30px;
        padding: 20px 0;
      }
      .index-row__meta,
      .index-row__cat {
        display: none;
      }
      .index-row__name {
        font-size: 1.5rem;
      }
      .footer__bottom {
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="page-search">
  <!-- Minimalist Header -->
  <header class="header">
    <div class="container header__inner">
      <div class="header__brand">
        <a href="../index.html" class="header__logo" data-cursor="HOME">OFFSET®</a>
        <span class="header__location">SEOUL, KR</span>
      </div>

      <nav class="header__nav" aria-label="Main navigation">
        <a href="places.html" class="header__nav-link" data-cursor="INDEX">Index</a>
        <a href="../index.html#section-selected" class="header__nav-link" data-cursor="SELECTION">Selected</a>
        <a href="../index.html#section-neighbourhoods" class="header__nav-link" data-cursor="DISTRICTS">Neighbourhoods</a>
      </nav>

      <div class="header__actions">
        <a href="search.html" class="header__nav-link header__nav-link--active" data-cursor="SEARCH">Search</a>
        <a href="saved.html" class="header__nav-link" data-cursor="ARCHIVE">Saved [<span class="bind-saved-count">00</span>]</a>
      </div>
    </div>
  </header>

  <main class="search-main">
    <div class="container">
      <div class="search-input-box">
        <input type="search" 
               class="editorial-search__input" 
               placeholder="DISCOVER SECTOR, DISTRICT OR SPACE..." 
               aria-label="Search places across Seoul archive">
      </div>

      <div class="search-meta-bar">
        <span>ARCHIVE INQUIRY TERMINAL</span>
        <span>[<strong class="search-count">00</strong>] COORDINATES FOUND</span>
      </div>

      <!-- Results List -->
      <section class="search-results-list" aria-label="Search results">
        <!-- Populated by assets/js/main.js -->
      </section>

      <!-- Empty State -->
      <div class="search-empty">
        <h2 class="search-empty__title">NO COORDINATES REGISTERED.</h2>
        <p class="search-empty__desc">Try another keyword, district or atmospheric query.</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__bottom">
      <p>&copy; 2026 OFFSET®. ALL RIGHTS RESERVED.</p>
      <p>THE CITY CHANGES WITH EVERY PLACE.</p>
    </div>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
